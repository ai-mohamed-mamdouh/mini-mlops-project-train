repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Linter
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff Formatter
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: pytest
        name: Python Tests (pytest)
        entry: uv run pytest -v
        language: system
        pass_filenames: false
        always_run: true
        verbose: false