services:

  training:
    build:
      context: .
      dockerfile: Dockerfile

    image: mini-mlops-training:1.0

    env_file:
      - .env

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_PATH: /app/data/dataset.csv
      ARTIFACT_DIR: /app/artifacts

    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    volumes:
      - ./data/processed:/app/data:ro
      - ./artifacts:/app/artifacts:rw
      - ./configs:/app/configs:ro

    depends_on:
      mlflow:
        condition: service_healthy

    restart: "no"


  mlflow:
    image: ghcr.io/mlflow/mlflow:v${MLFLOW_VERSION}

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "mlflow:5000,localhost:*,127.0.0.1:*"

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - mlartifacts:/mlflow

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped


volumes:
  mlartifacts: