
[project]
name = "mini-mlops"
version = "0.1.0"
description = "Mini MLOps training pipeline"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Mohamed Mamdouh", email = "ai.mohamed.mamdouh@gmail.com" }
]

dependencies = [
    "bentoml>=1.4,<2",
    "joblib>=1.6.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
[project.scripts]
mini-mlops = "mini_mlops.main:main"
